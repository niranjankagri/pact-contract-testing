# Contract testing pipeline:
#   1. consumer checks (lint, types, unit + contract tests) and provider tests run in parallel
#   2. the contract job runs the whole Pact workflow against a fresh Pact Broker (Docker Compose):
#      publish -> provider verification with results -> can-i-deploy -> record-deployment,
#      then the breaking-change demo (can-i-deploy must say no), and writes the broker's matrix to the summary.
#
# In a real setup the consumer and provider live in separate repositories with their own pipelines, sharing one
# long-lived broker; a broker webhook starts the provider's verification when a changed contract is published.
name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer:
    name: Consumer (checkout-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: checkout-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and contract tests (writes the pact file, and JUnit XML)
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Keep the pact file
        uses: actions/upload-artifact@v7
        with:
          name: pact-file
          path: pacts/
          retention-days: 14
      # JUnit XML only, as its own artifact: the CI results collection of
      # automation-coverage-quality-intelligence imports it (config/producers.toml there)
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-consumer
          path: checkout-web/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 30

  provider:
    name: Provider (product-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Unit and HTTP tests. The Pact folder test finds no pacts here and passes with a note;
      # the real verification runs in the contract job.
      - run: ./mvnw -B test
      # JUnit XML only, as its own artifact: the CI results collection of
      # automation-coverage-quality-intelligence imports it (config/producers.toml there)
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-provider
          path: product-service/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30

  contract:
    name: Pact workflow with broker
    needs: [consumer, provider]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The pull request's branch, or the pushed branch (git itself is on a detached HEAD in CI).
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            checkout-web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install the Pact CLI and the consumer
        run: |
          npm ci
          npm ci --prefix checkout-web
      - name: Contract workflow (broker up, test, publish, verify, can-i-deploy, record deployment)
        run: npm run contract
      - name: Breaking-change demo (can-i-deploy must say no)
        run: npm run demo:breaking
      - name: Broker matrix to the run summary
        if: ${{ !cancelled() }}
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Broker logs on failure
        if: ${{ failure() }}
        run: docker compose -f broker/docker-compose.yml logs broker
